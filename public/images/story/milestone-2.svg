<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <radialGradient id="m2-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a0d18" />
      <stop offset="60%" stop-color="#18040a" />
      <stop offset="100%" stop-color="#090104" />
    </radialGradient>
    <linearGradient id="mist-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#caa24d" stop-opacity="0" />
      <stop offset="50%" stop-color="#fcedc7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#caa24d" stop-opacity="0" />
    </linearGradient>
    <filter id="m2-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.5  0 0 0 0.06 0" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" />
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#m2-bg)" />
  <rect width="600" height="450" filter="url(#m2-grain)" />

  <!-- Crescent moon & stars -->
  <circle cx="480" cy="90" r="16" fill="#fcedc7" opacity="0.6" />
  <circle cx="486" cy="88" r="15" fill="#1e060e" />
  <circle cx="150" cy="70" r="1" fill="#fff5da" opacity="0.8" />
  <circle cx="220" cy="110" r="1" fill="#fff5da" opacity="0.5" />
  <circle cx="340" cy="60" r="1.2" fill="#fff5da" opacity="0.7" />
  <circle cx="400" cy="130" r="0.8" fill="#fff5da" opacity="0.6" />

  <!-- Mountain Silhouette Layers -->
  <!-- Deepest mountain range -->
  <path d="M 0 240 Q 140 180, 260 210 T 480 190 Q 550 210, 600 230 L 600 450 L 0 450 Z" fill="#120306" />

  <!-- Mountain layer 2 -->
  <path d="M 0 270 Q 180 230, 320 270 T 600 250 L 600 450 L 0 450 Z" fill="#1b050b" />

  <!-- Floating mist belt -->
  <ellipse cx="300" cy="270" rx="280" ry="30" fill="url(#mist-grad)" />

  <!-- Rolling Tea Hills foreground -->
  <path d="M -50 330 C 100 280, 220 350, 360 300 C 460 260, 550 320, 650 300 L 650 450 L -50 450 Z" fill="#240710" stroke="#caa24d" stroke-width="0.7" stroke-opacity="0.2" />

  <!-- Tea terrace contour lines -->
  <path d="M 50 340 C 140 310, 240 360, 340 330 C 440 290, 520 330, 580 320" stroke="#caa24d" stroke-width="0.5" stroke-dasharray="6 4" stroke-opacity="0.25" fill="none" />
  <path d="M 20 375 C 130 340, 260 395, 380 360 C 480 330, 550 370, 620 350" stroke="#caa24d" stroke-width="0.5" stroke-dasharray="8 5" stroke-opacity="0.2" fill="none" />
  <path d="M 0 410 C 120 380, 270 425, 410 390 C 500 370, 560 400, 600 390" stroke="#caa24d" stroke-width="0.5" stroke-dasharray="10 6" stroke-opacity="0.15" fill="none" />

  <!-- Road winding through the hills -->
  <path d="M 120 450 C 150 400, 200 370, 280 360 C 350 350, 420 330, 450 310" stroke="#caa24d" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 4" fill="none" />

  <!-- Pine tree silhouettes on ridge -->
  <g transform="translate(180, 285)" fill="#0d0205">
    <polygon points="0,0 -8,25 8,25" />
    <polygon points="0,15 -10,40 10,40" />
    <rect x="-1.5" y="40" width="3" height="8" />
  </g>
  <g transform="translate(195, 295)" fill="#0d0205">
    <polygon points="0,0 -6,20 6,20" />
    <polygon points="0,12 -8,32 8,32" />
    <rect x="-1" y="32" width="2" height="6" />
  </g>

  <!-- Archival stamp / border -->
  <rect x="20" y="20" width="560" height="410" stroke="#caa24d" stroke-width="0.75" stroke-opacity="0.3" fill="none" />
  <rect x="26" y="26" width="548" height="398" stroke="#caa24d" stroke-width="0.5" stroke-dasharray="3 4" stroke-opacity="0.15" fill="none" />

  <text x="300" y="418" font-family="serif" font-size="10" font-weight="500" fill="#caa24d" fill-opacity="0.6" letter-spacing="3" text-anchor="middle">MUNNAR · DECEMBER 2022</text>
</svg>
