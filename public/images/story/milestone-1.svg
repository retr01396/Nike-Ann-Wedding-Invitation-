<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" fill="none">
  <defs>
    <radialGradient id="m1-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#350b15" />
      <stop offset="60%" stop-color="#1c0409" />
      <stop offset="100%" stop-color="#0a0103" />
    </radialGradient>
    <linearGradient id="m1-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7" />
      <stop offset="50%" stop-color="#caa24d" />
      <stop offset="100%" stop-color="#7a5818" />
    </linearGradient>
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbd38d" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#d69e2e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#742a2a" stop-opacity="0" />
    </radialGradient>
    <filter id="m1-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.5  0 0 0 0.06 0" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" />
    </filter>
  </defs>

  <rect width="500" height="600" fill="url(#m1-bg)" />
  <rect width="500" height="600" filter="url(#m1-grain)" />

  <!-- Ambient Waterfront / Cafe lighting -->
  <circle cx="250" cy="220" r="160" fill="url(#lantern-glow)" />

  <!-- Hanging antique glass lanterns -->
  <line x1="180" y1="0" x2="180" y2="120" stroke="#caa24d" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="180" cy="130" r="12" fill="#caa24d" fill-opacity="0.3" />
  <circle cx="180" cy="130" r="6" fill="#fff5da" />

  <line x1="320" y1="0" x2="320" y2="160" stroke="#caa24d" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="320" cy="170" r="15" fill="#caa24d" fill-opacity="0.3" />
  <circle cx="320" cy="170" r="7" fill="#fff5da" />

  <!-- Architectural arch / window silhouette -->
  <path d="M 80 500 L 80 250 C 80 150, 160 100, 250 100 C 340 100, 420 150, 420 250 L 420 500 Z" stroke="#caa24d" stroke-width="0.8" stroke-opacity="0.25" fill="none" />
  <path d="M 100 500 L 100 260 C 100 170, 170 120, 250 120 C 330 120, 400 170, 400 260 L 400 500 Z" stroke="#caa24d" stroke-width="0.5" stroke-dasharray="4 6" stroke-opacity="0.15" fill="none" />

  <!-- Cafe table and two steaming cups -->
  <g transform="translate(150, 360)">
    <!-- Table base -->
    <ellipse cx="100" cy="80" rx="90" ry="14" fill="#140205" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.3" />
    <!-- Two coffee cups -->
    <path d="M 70 70 L 75 82 C 76 86, 84 86, 85 82 L 90 70 Z" fill="#caa24d" fill-opacity="0.6" />
    <path d="M 110 70 L 115 82 C 116 86, 124 86, 125 82 L 130 70 Z" fill="#caa24d" fill-opacity="0.6" />
    <!-- Steam swirls -->
    <path d="M 80 65 C 78 55, 84 50, 81 40" stroke="#fcedc7" stroke-width="1" stroke-linecap="round" opacity="0.4" fill="none" />
    <path d="M 120 65 C 122 55, 116 50, 119 40" stroke="#fcedc7" stroke-width="1" stroke-linecap="round" opacity="0.4" fill="none" />
  </g>

  <!-- Water reflections at bottom -->
  <line x1="120" y1="520" x2="380" y2="520" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="20 10 50 15 30" />
  <line x1="160" y1="535" x2="340" y2="535" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="30 15 40" />

  <!-- Archival stamp / border -->
  <rect x="25" y="25" width="450" height="550" stroke="#caa24d" stroke-width="0.75" stroke-opacity="0.3" fill="none" />
  <rect x="32" y="32" width="436" height="536" stroke="#caa24d" stroke-width="0.5" stroke-dasharray="3 4" stroke-opacity="0.15" fill="none" />

  <text x="250" y="562" font-family="serif" font-size="10" font-weight="500" fill="#caa24d" fill-opacity="0.6" letter-spacing="3" text-anchor="middle">KOCHI · OCTOBER 2020</text>
</svg>
