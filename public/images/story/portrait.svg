<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="p-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d0a14" />
      <stop offset="50%" stop-color="#220509" />
      <stop offset="100%" stop-color="#0d0104" />
    </radialGradient>
    <linearGradient id="p-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e6b5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#caa24d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8c6b24" stop-opacity="0.2" />
    </linearGradient>
    <filter id="p-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.5  0 0 0 0.05 0" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" />
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#p-bg)" />
  <rect width="400" height="500" filter="url(#p-grain)" />

  <!-- Soft warm romantic lighting -->
  <circle cx="200" cy="180" r="140" fill="#caa24d" opacity="0.12" filter="blur(30px)" />
  <circle cx="160" cy="240" r="100" fill="#751829" opacity="0.25" filter="blur(40px)" />

  <!-- Couple silhouette in embrace -->
  <g opacity="0.75" transform="translate(60, 80)">
    <!-- Groom profile -->
    <path d="M 100 120 C 95 90, 115 65, 140 70 C 160 75, 170 100, 160 130 C 150 150, 155 170, 165 200 C 175 230, 185 270, 190 320 L 70 320 C 75 260, 85 210, 95 170 Z" fill="#150205" />
    <!-- Bride profile -->
    <path d="M 160 110 C 175 85, 200 90, 210 115 C 220 140, 205 165, 195 190 C 185 220, 180 260, 180 320 L 130 320 C 140 250, 150 180, 150 140 Z" fill="#1a0408" />
    <!-- Delicate veil & hair flowing -->
    <path d="M 185 105 C 220 120, 250 170, 260 250 C 265 290, 260 320, 255 320 L 220 320 C 230 260, 215 170, 185 130 Z" fill="url(#p-gold)" opacity="0.4" />
  </g>

  <!-- Gold foil border & archival stamp -->
  <rect x="20" y="20" width="360" height="460" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.3" fill="none" />
  <rect x="26" y="26" width="348" height="448" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="3 4" stroke-opacity="0.2" fill="none" />

  <!-- Monogram Seal watermark at bottom -->
  <g transform="translate(200, 435)">
    <circle cx="0" cy="0" r="18" stroke="#caa24d" stroke-width="0.75" stroke-opacity="0.4" fill="#1c0408" fill-opacity="0.6" />
    <text x="0" y="4" font-family="serif" font-size="10" font-weight="bold" fill="#f7e6b5" fill-opacity="0.75" text-anchor="middle" letter-spacing="1">N&amp;A</text>
  </g>
</svg>
