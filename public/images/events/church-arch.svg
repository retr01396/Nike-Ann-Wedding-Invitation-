<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <defs>
    <radialGradient id="ca-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#340b15" />
      <stop offset="60%" stop-color="#1c0409" />
      <stop offset="100%" stop-color="#080103" />
    </radialGradient>
    <radialGradient id="ca-radiance" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff5da" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fbd38d" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#9b2c2c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#140306" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7" />
      <stop offset="50%" stop-color="#caa24d" />
      <stop offset="100%" stop-color="#7a5818" />
    </linearGradient>
    <filter id="ca-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.5  0 0 0 0.05 0" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" />
    </filter>
  </defs>

  <rect width="500" height="450" fill="url(#ca-bg)" />
  <rect width="500" height="450" filter="url(#ca-grain)" />

  <!-- Radiant altar glow -->
  <circle cx="250" cy="210" r="150" fill="url(#ca-radiance)" />

  <!-- Radiant light shafts streaming down -->
  <polygon points="250,90 160,400 340,400" fill="#fff5da" opacity="0.06" />
  <polygon points="250,90 190,400 310,400" fill="#fff5da" opacity="0.08" />

  <!-- Outer gold foil border & delicate stitching -->
  <rect x="20" y="20" width="460" height="410" stroke="#caa24d" stroke-width="0.75" stroke-opacity="0.3" fill="none" />
  <rect x="26" y="26" width="448" height="398" stroke="#caa24d" stroke-width="0.5" stroke-dasharray="3 4" stroke-opacity="0.15" fill="none" />

  <!-- Gothic Cathedral Pointed Arch Silhouettes -->
  <!-- Outer Main Arch Frame -->
  <path d="M 140 390 L 140 220 C 140 140, 250 80, 250 80 C 250 80, 360 140, 360 220 L 360 390 Z" stroke="url(#gold-arch)" stroke-width="1.5" stroke-opacity="0.6" fill="none" />

  <!-- Inner Recessed Arch Trim -->
  <path d="M 160 390 L 160 230 C 160 160, 250 110, 250 110 C 250 110, 340 160, 340 230 L 340 390" stroke="#caa24d" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4 4" fill="none" />

  <!-- Stained Glass Rose Wheel Motif inside upper arch -->
  <g transform="translate(250, 180)" stroke="url(#gold-arch)" stroke-width="0.8" fill="none" opacity="0.7">
    <circle cx="0" cy="0" r="42" />
    <circle cx="0" cy="0" r="28" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="14" />
    <!-- 8 Radiant Rose Petals -->
    <line x1="0" y1="-42" x2="0" y2="42" />
    <line x1="-42" y1="0" x2="42" y2="0" />
    <line x1="-30" y1="-30" x2="30" y2="30" />
    <line x1="-30" y1="30" x2="30" y2="-30" />
    <circle cx="0" cy="0" r="4" fill="#fff5da" />
  </g>

  <!-- Slender Twin Lancet Arches in lower half -->
  <!-- Left Lancet -->
  <path d="M 180 390 L 180 270 C 180 240, 235 220, 235 220 C 235 220, 245 235, 245 270 L 245 390" stroke="#caa24d" stroke-width="0.8" stroke-opacity="0.35" fill="none" />
  <!-- Right Lancet -->
  <path d="M 255 390 L 255 270 C 255 235, 265 220, 265 220 C 265 220, 320 240, 320 270 L 320 390" stroke="#caa24d" stroke-width="0.8" stroke-opacity="0.35" fill="none" />

  <!-- Sacred Altar Cross Silhouette at center -->
  <g transform="translate(250, 290)">
    <line x1="0" y1="-25" x2="0" y2="45" stroke="#fff5da" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="-8" x2="16" y2="-8" stroke="#fff5da" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="-8" r="3" fill="#caa24d" />
  </g>

  <!-- Sacred Altar Table and Candles -->
  <rect x="200" y="350" width="100" height="40" fill="#140205" stroke="#caa24d" stroke-width="0.75" stroke-opacity="0.4" />
  <!-- Left Candle -->
  <rect x="215" y="338" width="4" height="12" fill="#caa24d" />
  <ellipse cx="217" cy="333" rx="2" ry="4" fill="#fff5da" />
  <!-- Right Candle -->
  <rect x="281" y="338" width="4" height="12" fill="#caa24d" />
  <ellipse cx="283" cy="333" rx="2" ry="4" fill="#fff5da" />

  <text x="250" y="415" font-family="serif" font-size="9" font-weight="500" fill="#caa24d" fill-opacity="0.65" letter-spacing="3" text-anchor="middle">ST. THOMAS CATHEDRAL · NUPTIAL BLESSING</text>
</svg>
