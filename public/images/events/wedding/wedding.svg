<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <defs>
    <radialGradient id="wb-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b0c16" />
      <stop offset="55%" stop-color="#20050b" />
      <stop offset="100%" stop-color="#0a0104" />
    </radialGradient>
    <radialGradient id="wb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2d1" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#caa24d" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#741e2b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#140306" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5da" />
      <stop offset="25%" stop-color="#caa24d" />
      <stop offset="60%" stop-color="#fcedc7" />
      <stop offset="85%" stop-color="#9a762b" />
      <stop offset="100%" stop-color="#5e4112" />
    </linearGradient>
    <linearGradient id="silk-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#805b18" />
      <stop offset="100%" stop-color="#2e050c" />
    </linearGradient>
    <filter id="wb-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.5  0 0 0 0.05 0" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" />
    </filter>
  </defs>

  <rect width="500" height="450" fill="url(#wb-bg)" />
  <rect width="500" height="450" filter="url(#wb-grain)" />

  <!-- Warm ambient illumination behind bow -->
  <circle cx="250" cy="210" r="140" fill="url(#wb-glow)" />

  <!-- Outer gold foil border & delicate stitching -->
  <rect x="20" y="20" width="460" height="410" stroke="#caa24d" stroke-width="0.75" stroke-opacity="0.3" fill="none" />
  <rect x="26" y="26" width="448" height="398" stroke="#caa24d" stroke-width="0.5" stroke-dasharray="3 4" stroke-opacity="0.15" fill="none" />

  <!-- Corner filigrees -->
  <path d="M 32 40 L 40 40 L 40 32" stroke="#e5c57b" stroke-width="0.8" stroke-opacity="0.6" fill="none" />
  <path d="M 468 40 L 460 40 L 460 32" stroke="#e5c57b" stroke-width="0.8" stroke-opacity="0.6" fill="none" />
  <path d="M 32 410 L 40 410 L 40 418" stroke="#e5c57b" stroke-width="0.8" stroke-opacity="0.6" fill="none" />
  <path d="M 468 410 L 460 410 L 460 418" stroke="#e5c57b" stroke-width="0.8" stroke-opacity="0.6" fill="none" />

  <!-- Flowing ribbons behind knot -->
  <g opacity="0.85">
    <!-- Left Ribbon tail flowing down -->
    <path d="M 235 225 C 200 280, 160 320, 145 375 C 175 365, 200 375, 215 385 C 205 325, 225 285, 245 235 Z" fill="url(#gold-ribbon)" />
    <!-- Left Ribbon underside shadow -->
    <path d="M 235 225 C 215 270, 185 310, 165 355 C 160 330, 180 290, 205 250 Z" fill="url(#silk-shadow)" opacity="0.5" />

    <!-- Right Ribbon tail flowing down -->
    <path d="M 265 225 C 300 280, 340 320, 355 375 C 325 365, 300 375, 285 385 C 295 325, 275 285, 255 235 Z" fill="url(#gold-ribbon)" />
    <!-- Right Ribbon underside shadow -->
    <path d="M 265 225 C 285 270, 315 310, 335 355 C 340 330, 320 290, 295 250 Z" fill="url(#silk-shadow)" opacity="0.5" />
  </g>

  <!-- Left Bow Loop -->
  <g>
    <!-- Outer loop fold -->
    <path d="M 245 200 C 180 140, 110 150, 115 210 C 120 260, 180 250, 240 220 Z" fill="url(#gold-ribbon)" stroke="#caa24d" stroke-width="0.75" stroke-opacity="0.4" />
    <!-- Inner loop depth -->
    <path d="M 225 205 C 170 170, 140 180, 145 215 C 150 240, 185 235, 220 218 Z" fill="url(#silk-shadow)" opacity="0.8" />
    <!-- Silk luster highlight -->
    <path d="M 125 180 C 135 155, 175 150, 225 185" stroke="#fff5da" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none" />
  </g>

  <!-- Right Bow Loop -->
  <g>
    <!-- Outer loop fold -->
    <path d="M 255 200 C 320 140, 390 150, 385 210 C 380 260, 320 250, 260 220 Z" fill="url(#gold-ribbon)" stroke="#caa24d" stroke-width="0.75" stroke-opacity="0.4" />
    <!-- Inner loop depth -->
    <path d="M 275 205 C 330 170, 360 180, 355 215 C 350 240, 315 235, 280 218 Z" fill="url(#silk-shadow)" opacity="0.8" />
    <!-- Silk luster highlight -->
    <path d="M 375 180 C 365 155, 325 150, 275 185" stroke="#fff5da" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none" />
  </g>

  <!-- Central Knotted Ribbon Center -->
  <ellipse cx="250" cy="210" rx="20" ry="22" fill="url(#gold-ribbon)" stroke="#caa24d" stroke-width="1" stroke-opacity="0.5" />
  <path d="M 235 205 C 242 195, 258 195, 265 205 C 260 218, 260 225, 250 230 C 240 225, 240 218, 235 205 Z" fill="#caa24d" opacity="0.3" />
  <!-- Center gold pearl / jewel bead -->
  <circle cx="250" cy="210" r="5" fill="#fff5da" />
  <circle cx="250" cy="210" r="2.5" fill="#caa24d" />

  <!-- Delicate Jasmine Flora accents framing the bow -->
  <g opacity="0.75" stroke="#caa24d" stroke-width="0.5" fill="#fff5da">
    <!-- Left flower cluster -->
    <circle cx="105" cy="210" r="3.5" />
    <circle cx="98" cy="202" r="3" />
    <circle cx="96" cy="216" r="3" />
    <!-- Right flower cluster -->
    <circle cx="395" cy="210" r="3.5" />
    <circle cx="402" cy="202" r="3" />
    <circle cx="404" cy="216" r="3" />
  </g>

  <text x="250" y="415" font-family="serif" font-size="9" font-weight="500" fill="#caa24d" fill-opacity="0.65" letter-spacing="3" text-anchor="middle">CEREMONIAL MATRIMONY · THRISSUR</text>
</svg>
