<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-residence" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140206" />
      <stop offset="50%" stop-color="#1a040b" />
      <stop offset="100%" stop-color="#100104" />
    </linearGradient>

    <!-- Tharavadu Courtyard Radial Glow -->
    <radialGradient id="dest-glow-residence" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#caa24d" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#7a1828" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#140206" stop-opacity="0" />
    </radialGradient>

    <!-- Pin Shadow & Glow Filter -->
    <filter id="gold-glow-residence" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.79
        0 1 0 0 0.63
        0 0 1 0 0.30
        0 0 0 0.8 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Cartographic Canvas -->
  <rect width="600" height="380" fill="url(#bg-grad-residence)" />

  <!-- Thrissur Urban Residential Enclave Parcels -->
  <g fill="#170308" stroke="#2a0812" stroke-width="1" opacity="0.65">
    <rect x="40" y="40" width="90" height="70" rx="4" />
    <rect x="150" y="30" width="100" height="55" rx="4" />
    <rect x="350" y="35" width="100" height="55" rx="4" />
    <rect x="470" y="45" width="90" height="65" rx="4" />

    <rect x="35" y="140" width="90" height="95" rx="4" />
    <rect x="475" y="130" width="90" height="100" rx="4" />

    <rect x="45" y="260" width="95" height="75" rx="4" />
    <rect x="160" y="290" width="100" height="60" rx="4" />
    <rect x="340" y="290" width="110" height="55" rx="4" />
    <rect x="470" y="255" width="95" height="80" rx="4" />
  </g>

  <!-- Concentric Swaraj Round Ring Roads (Signature Thrissur Cartography) -->
  <g fill="none" stroke="#360c16" stroke-linecap="round">
    <circle cx="300" cy="180" r="160" stroke-width="2.5" />
    <circle cx="300" cy="180" r="115" stroke-width="3" />
    <circle cx="300" cy="180" r="70" stroke-width="4" stroke="#48121f" />
  </g>

  <!-- Swaraj Round Inner Ring Fine Gold Dotted Hairline -->
  <circle cx="300" cy="180" r="70" fill="none" stroke="#caa24d" stroke-width="0.9" stroke-opacity="0.35" stroke-dasharray="5,5" />

  <!-- Radiating Radial Avenues (Connecting City Center to Tharavadu Homestead) -->
  <g stroke="#3a0d17" stroke-width="2.5" stroke-linecap="round">
    <line x1="300" y1="20" x2="300" y2="360" />
    <line x1="60" y1="180" x2="540" y2="180" />
    <line x1="125" y1="55" x2="475" y2="305" stroke-dasharray="6,4" stroke="#2b0811" />
    <line x1="475" y1="55" x2="125" y2="305" stroke-dasharray="6,4" stroke="#2b0811" />
  </g>

  <!-- Main Residence Approach Boulevard -->
  <g stroke="#4f1521" stroke-width="5" stroke-linecap="round">
    <path d="M 60,180 L 300,180" />
  </g>
  <g stroke="#caa24d" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4">
    <path d="M 60,180 L 300,180" fill="none" />
  </g>

  <!-- Ancestral Tharavadu Courtyard Perimeter (Square Nalukettu Geometry) -->
  <rect x="274" y="154" width="52" height="52" rx="3" fill="#1c040a" stroke="#4f1521" stroke-width="2.5" />
  <rect x="274" y="154" width="52" height="52" rx="3" fill="none" stroke="#caa24d" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="3,3" />

  <!-- Inner Nadumuttam (Open Central Sky Courtyard) -->
  <rect x="290" y="170" width="20" height="20" fill="#120206" stroke="#caa24d" stroke-width="0.6" stroke-opacity="0.5" />

  <!-- Tharavadu Courtyard Radial Halo -->
  <circle cx="300" cy="180" r="75" fill="url(#dest-glow-residence)" />

  <!-- Distance Range Rings -->
  <circle cx="300" cy="180" r="95" fill="none" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="3,6" />
  <circle cx="300" cy="180" r="140" fill="none" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.14" stroke-dasharray="2,8" />

  <!-- Traditional Kerala Lamp Seal in Upper Corner -->
  <g transform="translate(535, 55)" opacity="0.4">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#caa24d" stroke-width="0.6" stroke-dasharray="2,3" />
    <path d="M -5,8 Q 0,11 5,8 L 4,2 L -4,2 Z" fill="#caa24d" />
    <line x1="0" y1="2" x2="0" y2="-6" stroke="#caa24d" stroke-width="1" />
    <path d="M 0,-6 Q -3,-10 0,-14 Q 3,-10 0,-6 Z" fill="#caa24d" />
    <text x="0" y="24" font-family="'Cinzel', serif" font-size="6" fill="#caa24d" text-anchor="middle" letter-spacing="1">THARAVADU</text>
  </g>

  <!-- Coordinates & Urban Sector Label -->
  <text x="35" y="360" font-family="sans-serif" font-size="7.5" fill="#caa24d" opacity="0.35" letter-spacing="2">
    10°31'28"N · 76°12'54"E
  </text>
  <text x="565" y="360" font-family="sans-serif" font-size="7.5" fill="#caa24d" opacity="0.35" letter-spacing="1.5" text-anchor="end">
    SWARAJ ENCLAVE
  </text>

  <!-- Glowing Golden Pinpoint Marker -->
  <g transform="translate(300, 172)" filter="url(#gold-glow-residence)">
    <!-- Concentric Wave Rings -->
    <circle cx="0" cy="8" r="14" fill="none" stroke="#caa24d" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;20;8" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Pin Drop Shadow -->
    <ellipse cx="0" cy="8" rx="5" ry="2" fill="#000" opacity="0.6" />

    <!-- Regal Location Pin Symbol -->
    <path d="M 0,8 C -5,2 -8,-4 -8,-10 C -8,-15.5 -3.5,-20 0,-20 C 3.5,-20 8,-15.5 8,-10 C 8,-4 5,2 0,8 Z"
          fill="#caa24d" stroke="#fff0c7" stroke-width="0.8" />
    
    <!-- Inner Pin Core Jewel -->
    <circle cx="0" cy="-10" r="3.2" fill="#140206" stroke="#caa24d" stroke-width="0.8" />
    <circle cx="0" cy="-10" r="1.2" fill="#fff0c7" />
  </g>
</svg>
