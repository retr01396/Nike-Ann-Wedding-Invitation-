<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-church" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120206" />
      <stop offset="50%" stop-color="#18040a" />
      <stop offset="100%" stop-color="#0e0104" />
    </linearGradient>

    <!-- Sanctuary Radial Glow -->
    <radialGradient id="dest-glow-church" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#caa24d" stop-opacity="0.30" />
      <stop offset="35%" stop-color="#6e1424" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#120206" stop-opacity="0" />
    </radialGradient>

    <!-- Pin Shadow & Glow Filter -->
    <filter id="gold-glow-church" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.79
        0 1 0 0 0.63
        0 0 1 0 0.30
        0 0 0 0.8 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Cartographic Canvas -->
  <rect width="600" height="380" fill="url(#bg-grad-church)" />

  <!-- Palayoor Waterway / Coastal Inlet Contour (Muted deep plum tone) -->
  <path d="M 0,60 Q 80,100 110,180 T 80,310 Q 60,360 0,380 L 0,0 Z"
        fill="#18060e" stroke="#2a0815" stroke-width="1.5" opacity="0.85" />
  <!-- Waterway Hairline Shore Accent -->
  <path d="M 0,60 Q 80,100 110,180 T 80,310 Q 60,360 0,380"
        fill="none" stroke="#caa24d" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="2,4" />

  <!-- Parish Grounds and Historic Courtyard Parcels -->
  <g fill="#170308" stroke="#2c0812" stroke-width="1" opacity="0.65">
    <rect x="140" y="40" width="80" height="70" rx="3" />
    <rect x="240" y="30" width="110" height="60" rx="3" />
    <rect x="370" y="45" width="90" height="50" rx="3" />
    <rect x="480" y="35" width="85" height="70" rx="3" />

    <rect x="135" y="130" width="90" height="90" rx="3" />
    <rect x="440" y="115" width="120" height="85" rx="3" />

    <rect x="145" y="240" width="75" height="80" rx="3" />
    <rect x="430" y="220" width="130" height="85" rx="3" />

    <rect x="230" y="295" width="95" height="60" rx="3" />
    <rect x="350" y="280" width="105" height="65" rx="3" />
    <rect x="475" y="320" width="85" height="45" rx="3" />
  </g>

  <!-- Minor Pilgrim Paths & Church Lane Network -->
  <g stroke="#26060f" stroke-width="1.5" stroke-linecap="round">
    <line x1="120" y1="110" x2="570" y2="110" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="120" y1="260" x2="570" y2="260" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="230" y1="20" x2="230" y2="360" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="365" y1="20" x2="365" y2="360" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="470" y1="20" x2="470" y2="360" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- Major Coastal Road (Chavakkad - Palayoor Route) -->
  <g stroke="#3a0d17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 115,20 Q 150,140 180,240 T 210,380" />
    <path d="M 470,0 Q 450,160 440,260 T 430,380" />
    <path d="M 110,180 C 180,185 240,175 300,180 S 480,190 600,180" />
  </g>

  <!-- Sacred Pilgrimage Procession Avenue (Approaching Church Altar) -->
  <g stroke="#4f1521" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 300,0 L 300,380" />
  </g>
  <!-- Avenue Center Dotted Line in Muted Gold -->
  <g stroke="#caa24d" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,5" stroke-linecap="round">
    <path d="M 300,0 L 300,380" fill="none" />
  </g>

  <!-- Cathedral Sanctuary Courtyard Octagon -->
  <polygon points="300,142 332,155 345,187 332,219 300,232 268,219 255,187 268,155"
           fill="#1a040a" stroke="#4f1521" stroke-width="2.5" />
  <polygon points="300,142 332,155 345,187 332,219 300,232 268,219 255,187 268,155"
           fill="none" stroke="#caa24d" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="3,3" />

  <!-- Sanctuary Precinct Radial Halo -->
  <circle cx="300" cy="187" r="75" fill="url(#dest-glow-church)" />

  <!-- Distance Range Rings -->
  <circle cx="300" cy="187" r="95" fill="none" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="3,6" />
  <circle cx="300" cy="187" r="145" fill="none" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.14" stroke-dasharray="2,8" />

  <!-- Heritage Cross Seal in Upper Corner -->
  <g transform="translate(535, 55)" opacity="0.4">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#caa24d" stroke-width="0.6" stroke-dasharray="2,3" />
    <path d="M 0,-14 L 0,14 M -8,-6 L 8,-6" stroke="#caa24d" stroke-width="1.2" stroke-linecap="round" />
    <text x="0" y="24" font-family="'Cinzel', serif" font-size="6" fill="#caa24d" text-anchor="middle" letter-spacing="1">AD 52</text>
  </g>

  <!-- Waterway & Coordinates Label -->
  <text x="35" y="360" font-family="sans-serif" font-size="7.5" fill="#caa24d" opacity="0.35" letter-spacing="2">
    10°35'42"N · 76°01'18"E
  </text>
  <text x="565" y="360" font-family="sans-serif" font-size="7.5" fill="#caa24d" opacity="0.35" letter-spacing="1.5" text-anchor="end">
    PALAYOOR SECTOR
  </text>

  <!-- Glowing Golden Pinpoint Marker -->
  <g transform="translate(300, 179)" filter="url(#gold-glow-church)">
    <!-- Concentric Wave Rings -->
    <circle cx="0" cy="8" r="14" fill="none" stroke="#caa24d" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;20;8" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Pin Drop Shadow -->
    <ellipse cx="0" cy="8" rx="5" ry="2" fill="#000" opacity="0.6" />

    <!-- Regal Location Pin Symbol -->
    <path d="M 0,8 C -5,2 -8,-4 -8,-10 C -8,-15.5 -3.5,-20 0,-20 C 3.5,-20 8,-15.5 8,-10 C 8,-4 5,2 0,8 Z"
          fill="#caa24d" stroke="#fff0c7" stroke-width="0.8" />
    
    <!-- Inner Pin Core Jewel -->
    <circle cx="0" cy="-10" r="3.2" fill="#120206" stroke="#caa24d" stroke-width="0.8" />
    <circle cx="0" cy="-10" r="1.2" fill="#fff0c7" />
  </g>
</svg>
