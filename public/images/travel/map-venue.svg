<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-venue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140206" />
      <stop offset="50%" stop-color="#1a040b" />
      <stop offset="100%" stop-color="#100104" />
    </linearGradient>

    <!-- Radial Glow at Center Destination -->
    <radialGradient id="dest-glow-venue" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#caa24d" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#8b1e32" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#140206" stop-opacity="0" />
    </radialGradient>

    <!-- Pin Shadow & Glow Filter -->
    <filter id="gold-glow-venue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.79
        0 1 0 0 0.63
        0 0 1 0 0.30
        0 0 0 0.8 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Cartographic Canvas -->
  <rect width="600" height="380" fill="url(#bg-grad-venue)" />

  <!-- City Parcels / Building Blocks -->
  <g fill="#180309" stroke="#2c0812" stroke-width="1" opacity="0.6">
    <rect x="40" y="30" width="85" height="60" rx="3" />
    <rect x="145" y="25" width="110" height="45" rx="3" />
    <rect x="275" y="35" width="70" height="50" rx="3" />
    <rect x="365" y="25" width="90" height="65" rx="3" />
    <rect x="475" y="30" width="85" height="75" rx="3" />

    <rect x="35" y="110" width="95" height="70" rx="3" />
    <rect x="150" y="90" width="90" height="75" rx="3" />
    <rect x="440" y="120" width="125" height="65" rx="3" />

    <rect x="45" y="200" width="80" height="85" rx="3" />
    <rect x="145" y="185" width="100" height="70" rx="3" />
    <rect x="430" y="205" width="135" height="80" rx="3" />

    <rect x="40" y="305" width="105" height="55" rx="3" />
    <rect x="165" y="275" width="90" height="75" rx="3" />
    <rect x="330" y="300" width="100" height="60" rx="3" />
    <rect x="450" y="305" width="110" height="50" rx="3" />
  </g>

  <!-- Minor Residential Streets -->
  <g stroke="#26060f" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="100" x2="570" y2="100" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="30" y1="195" x2="570" y2="195" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="30" y1="290" x2="570" y2="290" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="140" y1="20" x2="140" y2="360" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="265" y1="20" x2="265" y2="360" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="355" y1="20" x2="355" y2="360" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="420" y1="20" x2="420" y2="360" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- Major Secondary Avenues -->
  <g stroke="#380c16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0,145 Q 160,150 250,165 T 450,155 L 600,165" />
    <path d="M 140,0 Q 150,120 165,220 T 180,380" />
    <path d="M 440,0 Q 430,140 415,240 T 400,380" />
    <path d="M 0,265 C 150,260 220,270 300,260 S 480,275 600,260" />
  </g>

  <!-- Primary Highway NH-544 (Thick Arterial Route) -->
  <g stroke="#4f1521" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0,220 C 130,210 210,195 300,180 S 470,160 600,130" />
  </g>
  <!-- Highway Center Hairline in Muted Antique Gold -->
  <g stroke="#caa24d" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="8,6" stroke-linecap="round">
    <path d="M 0,220 C 130,210 210,195 300,180 S 470,160 600,130" fill="none" />
  </g>

  <!-- Express Interchange Roundabout at Center -->
  <circle cx="300" cy="180" r="38" fill="#1b040a" stroke="#4f1521" stroke-width="3" />
  <circle cx="300" cy="180" r="38" fill="none" stroke="#caa24d" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4,4" />
  
  <!-- Venue Destination Precinct Halo -->
  <circle cx="300" cy="180" r="75" fill="url(#dest-glow-venue)" />

  <!-- Distance Range Rings (Luxury Cartographic Fine Hairlines) -->
  <circle cx="300" cy="180" r="95" fill="none" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.22" stroke-dasharray="3,6" />
  <circle cx="300" cy="180" r="150" fill="none" stroke="#caa24d" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="2,8" />

  <!-- Navigation Compass Accent in Upper Corner -->
  <g transform="translate(535, 55)" opacity="0.4">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#caa24d" stroke-width="0.6" stroke-dasharray="2,3" />
    <path d="M 0,-16 L 3,-4 L 0,-1 L -3,-4 Z" fill="#caa24d" />
    <path d="M 0,16 L 3,4 L 0,1 L -3,4 Z" fill="#caa24d" opacity="0.6" />
    <path d="M -16,0 L -4,3 L -1,0 L -4,-3 Z" fill="#caa24d" opacity="0.6" />
    <path d="M 16,0 L 4,3 L 1,0 L 4,-3 Z" fill="#caa24d" opacity="0.6" />
    <text x="0" y="-19" font-family="'Cinzel', serif" font-size="7" fill="#caa24d" text-anchor="middle" letter-spacing="1">N</text>
  </g>

  <!-- Coordinates Watermark -->
  <text x="35" y="360" font-family="sans-serif" font-size="7.5" fill="#caa24d" opacity="0.35" letter-spacing="2">
    10°33'18"N · 76°11'06"E
  </text>
  <text x="565" y="360" font-family="sans-serif" font-size="7.5" fill="#caa24d" opacity="0.35" letter-spacing="1.5" text-anchor="end">
    NH 544 SECTOR
  </text>

  <!-- Glowing Golden Pinpoint Marker (Matches Reference Centered Pin) -->
  <g transform="translate(300, 172)" filter="url(#gold-glow-venue)">
    <!-- Concentric Wave Rings -->
    <circle cx="0" cy="8" r="14" fill="none" stroke="#caa24d" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;20;8" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Pin Drop Shadow -->
    <ellipse cx="0" cy="8" rx="5" ry="2" fill="#000" opacity="0.6" />

    <!-- Regal Location Pin Symbol -->
    <path d="M 0,8 C -5,2 -8,-4 -8,-10 C -8,-15.5 -3.5,-20 0,-20 C 3.5,-20 8,-15.5 8,-10 C 8,-4 5,2 0,8 Z"
          fill="#caa24d" stroke="#fff0c7" stroke-width="0.8" />
    
    <!-- Inner Pin Core Jewel -->
    <circle cx="0" cy="-10" r="3.2" fill="#140206" stroke="#caa24d" stroke-width="0.8" />
    <circle cx="0" cy="-10" r="1.2" fill="#fff0c7" />
  </g>
</svg>
